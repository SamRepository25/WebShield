name: Record Netlify Deployment

on:
  push:
    branches:
      - main

permissions:
  deployments: write

jobs:
  deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub Deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'WebShield - Production',
              auto_merge: false,
              required_contexts: [],
              description: 'Deploying via Netlify'
            });

            core.setOutput('deployment_id', deployment.data.id);

      - name: Mark Deployment In Progress
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.deployment_id }},
              state: 'in_progress',
              description: 'Waiting for Netlify deployment'
            });

      - name: Poll Netlify for build status
        id: netlify_status
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          COMMIT_SHA="${{ github.sha }}"
          MAX_ATTEMPTS=30
          ATTEMPT=0
          STATE=""

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do

            RESPONSE=$(curl -sS \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys?per_page=20")

            STATE=$(echo "$RESPONSE" | python3 -c "
          import json
          import sys

          data = json.load(sys.stdin)

          for deploy in data:
              if deploy.get('commit_ref') == '$COMMIT_SHA':
                  print(deploy.get('state', ''))
                  break
          ")

            echo "Commit: $COMMIT_SHA"
            echo "Netlify state: $STATE"

            if [ "$STATE" = "ready" ]; then
              echo "Netlify deployment succeeded."
              break
            fi

            if [ "$STATE" = "error" ]; then
              echo "Netlify deployment failed."
              break
            fi

            echo "Waiting for Netlify deployment... ($((ATTEMPT + 1))/$MAX_ATTEMPTS)"

            sleep 10

            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "final_state=$STATE" >> "$GITHUB_OUTPUT"

      - name: Mark Deployment Status
        uses: actions/github-script@v7
        with:
          script: |
            const finalState = '${{ steps.netlify_status.outputs.final_state }}';

            console.log(`Final Netlify state: ${finalState}`);

            let deploymentState;
            let description;

            if (finalState === 'ready') {
              deploymentState = 'success';
              description = 'Successfully deployed to Netlify';
            } else if (finalState === 'error') {
              deploymentState = 'failure';
              description = 'Netlify deployment failed';
            } else {
              deploymentState = 'failure';
              description = `Netlify deployment timed out or returned: ${finalState || 'no state'}`;
            }

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.deployment_id }},
              state: deploymentState,
              environment: 'WebShield - Production',
              environment_url: 'https://webshield-security.netlify.app',
              description: description,
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Fail workflow if Netlify failed
        if: steps.netlify_status.outputs.final_state != 'ready'
        run: |
          echo "Netlify deployment did not succeed."
          echo "Final state: ${{ steps.netlify_status.outputs.final_state }}"
          exit 1
