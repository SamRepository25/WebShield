name: Record Netlify Deployment

on:
  push:
    branches:
      - main

permissions:
  deployments: write

jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'Deployed via Netlify'
            });
            core.setOutput('deployment_id', deployment.data.id);

      - name: Poll Netlify for build status
        id: netlify_status
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          COMMIT_SHA="${{ github.sha }}"
          MAX_ATTEMPTS=30
          ATTEMPT=0
          STATE=""

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            RESPONSE=$(curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys?per_page=5")

            STATE=$(echo "$RESPONSE" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for d in data:
              if d.get('commit_ref') == '$COMMIT_SHA':
                  print(d.get('state'))
                  break
          ")

            if [ "$STATE" == "ready" ]; then
              echo "Netlify build succeeded."
              break
            elif [ "$STATE" == "error" ]; then
              echo "Netlify build failed."
              break
            fi

            echo "Waiting for Netlify build... (attempt $((ATTEMPT+1))/$MAX_ATTEMPTS)"
            sleep 10
            ATTEMPT=$((ATTEMPT+1))
          done

          echo "final_state=$STATE" >> "$GITHUB_OUTPUT"

      - name: Mark Deployment Status
        uses: actions/github-script@v7
        with:
          script: |
            const finalState = "${{ steps.netlify_status.outputs.final_state }}";
            const state = finalState === "ready" ? "success" : "failure";
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.deployment_id }},
              state: state,
              environment_url: 'https://webshield-security.netlify.app',
              description: state === 'success' ? 'Deployed to Netlify' : 'Netlify build failed or timed out'
            });
